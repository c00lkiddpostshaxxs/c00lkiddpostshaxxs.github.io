<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy RLO Character</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            background: white;
            padding: 2rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 90vw;
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            color: #333;
        }

        p {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .copy-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.9rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            min-height: 44px;
            touch-action: manipulation;
        }

        .copy-btn.rlo-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .copy-btn.rlo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .copy-btn.rlo-btn.copied {
            background: linear-gradient(135deg, #48c774 0%, #34b956 100%);
            box-shadow: 0 4px 15px rgba(72, 199, 116, 0.4);
        }

        .copy-btn.pdf-btn {
            background: linear-gradient(135deg, #ff9500 0%, #ff6b35 100%);
            box-shadow: 0 4px 15px rgba(255, 149, 0, 0.4);
        }

        .copy-btn.pdf-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 149, 0, 0.6);
        }

        .copy-btn.pdf-btn.copied {
            background: linear-gradient(135deg, #48c774 0%, #34b956 100%);
            box-shadow: 0 4px 15px rgba(72, 199, 116, 0.4);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .info-section {
            text-align: left;
            background: #f5f5f5;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1.5rem;
        }

        .info-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.25rem;
            margin-top: 1rem;
        }

        .info-label:first-child {
            margin-top: 0;
        }

        /* Tablet/iPad optimizations (481px - 1024px) */
        @media (min-width: 481px) and (max-width: 1024px) {
            body {
                padding: 1.5rem;
            }

            .container {
                padding: 2rem 2.5rem;
                border-radius: 12px;
                max-width: 600px;
            }

            h1 {
                font-size: 1.35rem;
                margin-bottom: 0.75rem;
            }

            p {
                font-size: 0.95rem;
                margin-bottom: 1.75rem;
            }

            .button-group {
                gap: 1rem;
                margin-bottom: 2rem;
            }

            .copy-btn {
                padding: 0.9rem 2rem;
                font-size: 1rem;
                min-height: 48px;
                flex: 1;
                max-width: 200px;
            }

            .info-section {
                padding: 1.5rem;
            }

            .info-label {
                font-size: 0.9rem;
            }

            .info-text {
                font-size: 0.85rem;
            }
        }

        /* Mobile optimizations (max 480px) */
        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }

            .container {
                padding: 1.5rem 1.25rem;
                border-radius: 10px;
            }

            h1 {
                font-size: 1.1rem;
                margin-bottom: 0.5rem;
            }

            p {
                font-size: 0.85rem;
                margin-bottom: 1.25rem;
            }

            .button-group {
                flex-direction: column;
                gap: 0.75rem;
                margin-bottom: 1.5rem;
            }

            .copy-btn {
                padding: 0.85rem 2rem;
                font-size: 0.95rem;
                width: 100%;
                min-height: 44px;
            }

            .info-section {
                padding: 1rem;
            }

            .info-label {
                font-size: 0.8rem;
            }

            .info-text {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Copy Unicode Direction Characters</h1>
        <p>Click a button to copy the character to your clipboard.</p>
        <div class="button-group">
            <button class="copy-btn rlo-btn" id="copyRloBtn">Copy RLO</button>
            <button class="copy-btn pdf-btn" id="copyPdfBtn">Copy PDF</button>
        </div>
        <div class="info-section">
            <p class="info-label">RLO (Right-to-Left Override):</p>
            <p class="info-text">[‮]</p>
            <p class="info-label">PDF (Pop Directional Formatting):</p>
            <p class="info-text">[‬]</p>
        </div>
    </div>

    <script>
        const RLO_CHAR = '\u202E'; // Right-to-Left Override
        const PDF_CHAR = '\u202C'; // Pop Directional Formatting

        const copyRloBtn = document.getElementById('copyRloBtn');
        const copyPdfBtn = document.getElementById('copyPdfBtn');

        function handleCopy(button, character) {
            navigator.clipboard.writeText(character)
                .then(() => {
                    const originalText = button.textContent;
                    button.textContent = 'Copied!';
                    button.classList.add('copied');

                    setTimeout(() => {
                        button.textContent = originalText;
                        button.classList.remove('copied');
                    }, 2000);
                })
                .catch(err => {
                    console.error('Failed to copy to clipboard:', err);
                    const originalText = button.textContent;
                    button.textContent = 'Failed!';
                    setTimeout(() => {
                        button.textContent = originalText;
                    }, 2000);
                });
        }

        copyRloBtn.addEventListener('click', () => handleCopy(copyRloBtn, RLO_CHAR));
        copyPdfBtn.addEventListener('click', () => handleCopy(copyPdfBtn, PDF_CHAR));
    </script>
</body>
</html>
