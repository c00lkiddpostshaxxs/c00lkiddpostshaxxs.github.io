<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard Admin</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
        .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 40px; width: 100%; max-width: 360px; }
        .login-box h1 { font-size: 24px; margin-bottom: 24px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 16px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 16px; }
        .login-box input::placeholder { color: #64748b; }
        .login-box button { width: 100%; padding: 12px; background: #3b82f6; border: none; border-radius: 6px; color: white; font-weight: 600; cursor: pointer; font-size: 16px; margin-bottom: 12px; }
        .login-box button:hover { background: #2563eb; }
        .login-box .github-btn { background: #1f2937; border: 1px solid #374151; }
        .login-box .github-btn:hover { background: #374151; }
        .admin-container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
        .admin-header h1 { font-size: 28px; }
        .logout-btn { padding: 10px 20px; background: #ef4444; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: 600; }
        .logout-btn:hover { background: #dc2626; }
        .section { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
        .section h2 { font-size: 20px; margin-bottom: 16px; color: #60a5fa; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #cbd5e1; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-family: monospace; font-size: 14px; resize: vertical; }
        .form-group textarea { min-height: 60px; }
        .form-group input::placeholder, .form-group textarea::placeholder { color: #64748b; }
        .btn-primary { padding: 10px 20px; background: #3b82f6; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: 600; font-size: 14px; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { padding: 8px 12px; background: #ef4444; border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 12px; }
        .btn-danger:hover { background: #dc2626; }
        .buttons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
        .button-card { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 12px; text-align: center; position: relative; }
        .button-card button { width: 100%; padding: 10px; background: #10b981; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: 600; font-size: 14px; margin-bottom: 8px; word-break: break-word; }
        .button-card button:hover { background: #059669; }
        .button-card .delete { width: 100%; padding: 6px; background: #ef4444; font-size: 12px; }
        .button-card .delete:hover { background: #dc2626; }
        .button-card .label { font-size: 12px; color: #94a3b8; word-break: break-word; margin-bottom: 8px; }
        .message { padding: 12px; border-radius: 6px; margin-bottom: 16px; font-weight: 600; }
        .message.success { background: #10b98140; border: 1px solid #10b981; color: #86efac; }
        .message.error { background: #ef444440; border: 1px solid #ef4444; color: #fca5a5; }
        .git-status { font-size: 12px; color: #94a3b8; margin-top: 12px; }
        .auth-status { padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; font-size: 12px; color: #cbd5e1; margin-bottom: 16px; }
        .warning { padding: 12px; background: #0f172a; border: 1px solid #d97706; border-radius: 6px; margin-bottom: 16px; font-size: 12px; color: #fca5a5; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // PASSWORD HASH (SHA-256)
        // Generate your own at https://www.sha256.org/
        // Change this to your password's hash!
        const PASSWORD_HASH = 'a402fbbf2d99cd4868f96b06dd047f402eee30e03d1b2a10650476e6723dc69b';

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [password, setPassword] = useState('');
            const [sessionId, setSessionId] = useState(null);
            const [githubAuthed, setGithubAuthed] = useState(false);
            const [buttons, setButtons] = useState(() => {
                const stored = localStorage.getItem('clipboardButtons');
                return stored ? JSON.parse(stored) : [];
            });
            const [label, setLabel] = useState('');
            const [content, setContent] = useState('');
            const [message, setMessage] = useState('');
            const [githubStatus, setGithubStatus] = useState('');

            useEffect(() => {
                localStorage.setItem('clipboardButtons', JSON.stringify(buttons));
            }, [buttons]);

            useEffect(() => {
                // Check if we're coming back from GitHub OAuth
                const params = new URLSearchParams(window.location.search);
                const session = params.get('session');
                if (session) {
                    setSessionId(session);
                    setGithubAuthed(true);
                    // Clean up URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                    showMessage('✓ GitHub authorized!', 'success');
                }
            }, []);

            const hashPassword = async (pwd) => {
                const encoder = new TextEncoder();
                const data = encoder.encode(pwd);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                const hash = await hashPassword(password);
                if (hash === PASSWORD_HASH) {
                    setIsLoggedIn(true);
                    setPassword('');
                } else {
                    showMessage('Wrong password, bro', 'error');
                }
            };

            const handleAddButton = (e) => {
                e.preventDefault();
                if (!label.trim() || !content.trim()) {
                    showMessage('Label and content cannot be empty', 'error');
                    return;
                }
                setButtons([...buttons, { id: Date.now(), label, content }]);
                setLabel('');
                setContent('');
                showMessage('Button added!', 'success');
            };

            const handleDeleteButton = (id) => {
                setButtons(buttons.filter(btn => btn.id !== id));
                showMessage('Button deleted', 'success');
            };

            const handleCopy = (text) => {
                navigator.clipboard.writeText(text);
                showMessage('Copied to clipboard!', 'success');
            };

            const showMessage = (msg, type) => {
                setMessage({ text: msg, type });
                setTimeout(() => setMessage(''), 3000);
            };

            const handleGitHubLogin = () => {
                window.location.href = 'https://c00lkiddpostshaxxs.vercel.app/api/auth';
            };

            const handleCommitToGithub = async () => {
                if (!sessionId) {
                    showMessage('Not authenticated with GitHub', 'error');
                    return;
                }

                setGithubStatus('Committing...');

                try {
                    const response = await fetch('https://c00lkiddpostshaxxs.vercel.app/api/commit', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId, buttons })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showMessage('✓ Committed to GitHub!', 'success');
                        setGithubStatus('✓ Last committed: just now');
                    } else {
                        setGithubStatus(`✗ Error: ${data.error}`);
                    }
                } catch (error) {
                    setGithubStatus(`✗ Error: ${error.message}`);
                }
            };

            if (!isLoggedIn) {
                return (
                    <div className="login-container">
                        <div className="login-box">
                            <h1>🔐 Admin Panel</h1>
                            <form onSubmit={handleLogin}>
                                <input
                                    type="password"
                                    placeholder="Password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    autoFocus
                                />
                                <button type="submit">Login</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="admin-container">
                    <div className="admin-header">
                        <h1>📋 Clipboard Manager</h1>
                        <button className="logout-btn" onClick={() => setIsLoggedIn(false)}>Logout</button>
                    </div>

                    {message && <div className={`message ${message.type}`}>{message.text}</div>}

                    <div className="section">
                        <h2>➕ Add New Button</h2>
                        <form onSubmit={handleAddButton}>
                            <div className="form-group">
                                <label>Button Label</label>
                                <input
                                    type="text"
                                    placeholder="e.g., API Key"
                                    value={label}
                                    onChange={(e) => setLabel(e.target.value)}
                                />
                            </div>
                            <div className="form-group">
                                <label>Content to Copy</label>
                                <textarea
                                    placeholder="e.g., sk-1234567890..."
                                    value={content}
                                    onChange={(e) => setContent(e.target.value)}
                                />
                            </div>
                            <button type="submit" className="btn-primary">Add Button</button>
                        </form>
                    </div>

                    <div className="section">
                        <h2>🎯 Your Buttons ({buttons.length})</h2>
                        {buttons.length === 0 ? (
                            <p style={{ color: '#94a3b8' }}>No buttons yet. Add one above!</p>
                        ) : (
                            <div className="buttons-grid">
                                {buttons.map(btn => (
                                    <div key={btn.id} className="button-card">
                                        <div className="label">{btn.label}</div>
                                        <button onClick={() => handleCopy(btn.content)}>Copy</button>
                                        <button className="delete btn-danger" onClick={() => handleDeleteButton(btn.id)}>Delete</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="section">
                        <h2>🚀 GitHub Commit</h2>
                        <div className="warning">
                            ⚠️ <strong>Security:</strong> GitHub OAuth token is secure. Client Secret stays on backend. You can revoke access anytime in GitHub settings.
                        </div>
                        {!githubAuthed ? (
                            <div>
                                <p style={{ color: '#cbd5e1', marginBottom: '16px', fontSize: '14px' }}>
                                    Click to authorize with GitHub. Your buttons will commit as <code>buttons.json</code> to the repo.
                                </p>
                                <button className="btn-primary github-btn" onClick={handleGitHubLogin} style={{ background: '#1f2937', border: '1px solid #374151', width: '100%' }}>
                                    🔗 Login with GitHub
                                </button>
                            </div>
                        ) : (
                            <div>
                                <div className="auth-status">✓ Authorized with GitHub (session-based, auto-expires)</div>
                                <button className="btn-primary" onClick={handleCommitToGithub} style={{ width: '100%' }}>Commit buttons.json to GitHub</button>
                                {githubStatus && <div className="git-status">{githubStatus}</div>}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
