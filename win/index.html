<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard Admin</title>
    <link rel="icon" type="image/svg+xml" href="clipboard-icon.svg">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
        .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 40px; width: 100%; max-width: 360px; }
        .login-box h1 { font-size: 24px; margin-bottom: 24px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 16px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 16px; }
        .login-box input::placeholder { color: #64748b; }
        .login-box button { width: 100%; padding: 12px; background: #3b82f6; border: none; border-radius: 6px; color: white; font-weight: 600; cursor: pointer; font-size: 16px; }
        .login-box button:hover { background: #2563eb; }
        .admin-container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
        .admin-header h1 { font-size: 28px; }
        .logout-btn { padding: 10px 20px; background: #ef4444; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: 600; }
        .logout-btn:hover { background: #dc2626; }
        .section { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
        .section h2 { font-size: 20px; margin-bottom: 16px; color: #60a5fa; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #cbd5e1; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-family: monospace; font-size: 14px; resize: vertical; }
        .form-group textarea { min-height: 60px; }
        .form-group input::placeholder, .form-group textarea::placeholder { color: #64748b; }
        .btn-primary { padding: 10px 20px; background: #3b82f6; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: 600; font-size: 14px; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { padding: 8px 12px; background: #ef4444; border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 12px; }
        .btn-danger:hover { background: #dc2626; }
        .buttons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
        .button-card { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 12px; text-align: center; }
        .button-card button { width: 100%; padding: 10px; background: #10b981; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
        .button-card button:hover { background: #059669; }
        .button-card .delete { background: #ef4444; }
        .button-card .delete:hover { background: #dc2626; }
        .button-card .label { font-size: 12px; color: #94a3b8; word-break: break-word; margin-bottom: 8px; }
        .message { padding: 12px; border-radius: 6px; margin-bottom: 16px; font-weight: 600; }
        .message.success { background: #10b98140; border: 1px solid #10b981; color: #86efac; }
        .message.error { background: #ef444440; border: 1px solid #ef4444; color: #fca5a5; }
        .warning { padding: 12px; background: #0f172a; border: 1px solid #d97706; border-radius: 6px; margin-bottom: 16px; font-size: 12px; color: #fca5a5; }
        .git-status { font-size: 12px; color: #94a3b8; margin-top: 12px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const PASSWORD_HASH = 'a402fbbf2d99cd4868f96b06dd047f402eee30e03d1b2a10650476e6723dc69b';

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [password, setPassword] = useState('');
            const [buttons, setButtons] = useState(() => {
                const stored = localStorage.getItem('clipboardButtons');
                return stored ? JSON.parse(stored) : [];
            });
            const [label, setLabel] = useState('');
            const [content, setContent] = useState('');
            const [message, setMessage] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [copiedId, setCopiedId] = useState(null);
            const [appleNumber, setAppleNumber] = useState('');
            const [appleOutput, setAppleOutput] = useState('');
            const [loopParam, setLoopParam] = useState(false);
            const [fullscreenParam, setFullscreenParam] = useState(false);
            const [videoOnTopParam, setVideoOnTopParam] = useState(false);
            
            // Hardcode your concatenation strings here (supports backslashes: use \\ for single \)
            const THING1 = '!combo win+r|!wait 1|!type cmd /k fo|!type r /l %|!send i in (1,1,';
            const THING2 = ') do (start "" "C:\Program Files\VideoLAN\VLC\vlc.exe" ';
            const THING3 = ' "Z:\badapple.mp4")';
            const [githubToken, setGithubToken] = useState(() => sessionStorage.getItem('githubToken') || '');
            const [encryptPassword, setEncryptPassword] = useState('');
            const [githubStatus, setGithubStatus] = useState('');
            const [githubAuthed, setGithubAuthed] = useState(() => {
                const params = new URLSearchParams(window.location.search);
                return !!params.get('session');
            });
            const [sessionId, setSessionId] = useState(() => {
                const params = new URLSearchParams(window.location.search);
                return params.get('session') || '';
            });

            useEffect(() => {
                localStorage.setItem('clipboardButtons', JSON.stringify(buttons));
            }, [buttons]);

            const hashPassword = async (pwd) => {
                const encoder = new TextEncoder();
                const data = encoder.encode(pwd);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            };

            const encryptButtons = async (buttonsToEncrypt, pwd) => {
                const encoder = new TextEncoder();
                const data = encoder.encode(JSON.stringify(buttonsToEncrypt));
                
                const passwordKey = await crypto.subtle.importKey(
                    'raw',
                    encoder.encode(pwd),
                    'PBKDF2',
                    false,
                    ['deriveKey']
                );
                
                const key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: encoder.encode('salt123'), iterations: 100000, hash: 'SHA-256' },
                    passwordKey,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['encrypt']
                );
                
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const encrypted = await crypto.subtle.encrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    data
                );
                
                const combined = new Uint8Array(iv.length + encrypted.byteLength);
                combined.set(iv);
                combined.set(new Uint8Array(encrypted), iv.length);
                
                return btoa(String.fromCharCode(...combined));
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                const hash = await hashPassword(password);
                if (hash === PASSWORD_HASH) {
                    setIsLoggedIn(true);
                    setPassword('');
                } else {
                    showMessage('Wrong password, bro', 'error');
                }
            };

            const handleAddButton = (e) => {
                e.preventDefault();
                if (!label.trim() || !content.trim()) {
                    showMessage('Label and content cannot be empty', 'error');
                    return;
                }
                setButtons([...buttons, { id: Date.now(), label, content }]);
                setLabel('');
                setContent('');
                showMessage('Button added!', 'success');
            };

            const handleDeleteButton = (id) => {
                setButtons(buttons.filter(btn => btn.id !== id));
                showMessage('Button deleted', 'success');
            };

            const handleCopy = (text, id) => {
                navigator.clipboard.writeText(text);
                setCopiedId(id);
                setTimeout(() => setCopiedId(null), 2000);
                showMessage('Copied to clipboard!', 'success');
            };

            const showMessage = (msg, type) => {
                setMessage({ text: msg, type });
                setTimeout(() => setMessage(''), 3000);
            };

            const handleGitHubLogin = () => {
                window.location.href = 'https://c00lkiddpostshaxxs.vercel.app/api/auth';
            };

            const generateApple = () => {
                if (!appleNumber.trim()) {
                    showMessage('Enter a number!', 'error');
                    return;
                }
                
                let result = THING1 + appleNumber + THING2;
                
                // Add parameters if checked
                if (loopParam) result += ' --loop';
                if (fullscreenParam) result += ' --fullscreen';
                if (videoOnTopParam) result += ' --video-on-top';
                
                // Add THING3 at the end
                result += THING3;
                
                // Check character limit
                if (result.length > 200) {
                    showMessage('Over character limit! Current: ' + result.length + '/200', 'error');
                    return;
                }
                
                setAppleOutput(result);
            };
            
            const generateAppleMaxed = () => {
                if (!appleNumber.trim()) {
                    showMessage('Enter a number!', 'error');
                    return;
                }
                
                let result = THING1 + appleNumber + THING2;
                
                // Add parameters if checked
                if (loopParam) result += ' --loop';
                if (fullscreenParam) result += ' --fullscreen';
                if (videoOnTopParam) result += ' --video-on-top';
                
                // Add THING3 at the end
                result += THING3;
                
                // If over limit, trim the number to fit
                if (result.length > 200) {
                    const overhead = (THING1 + THING2 + THING3).length;
                    let params = '';
                    if (loopParam) params += ' --loop';
                    if (fullscreenParam) params += ' --fullscreen';
                    if (videoOnTopParam) params += ' --video-on-top';
                    
                    const paramsLength = params.length;
                    const maxNumberLength = 200 - overhead - paramsLength;
                    
                    if (maxNumberLength > 0) {
                        const trimmedNumber = appleNumber.substring(0, maxNumberLength);
                        result = THING1 + trimmedNumber + THING2 + params + THING3;
                    } else {
                        showMessage('Parameters too long to fit in 200 char limit!', 'error');
                        return;
                    }
                }
                
                setAppleOutput(result);
            };

            const handleCommitToGithub = async () => {
                if (!githubAuthed) {
                    showMessage('Please authorize with GitHub first', 'error');
                    return;
                }
                
                if (!encryptPassword.trim()) {
                    showMessage('Enter password to encrypt buttons', 'error');
                    return;
                }

                setGithubStatus('Encrypting & committing...');

                try {
                    const params = new URLSearchParams(window.location.search);
                    const sessionId = params.get('session');
                    
                    if (!sessionId) {
                        showMessage('Session expired, please authorize again', 'error');
                        setGithubAuthed(false);
                        return;
                    }

                    const encrypted = await encryptButtons(buttons, encryptPassword);

                    const response = await fetch('https://c00lkiddpostshaxxs.vercel.app/api/commit?session=' + sessionId, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ encryptedData: encrypted })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showMessage('✓ Encrypted & committed to GitHub!', 'success');
                        setGithubStatus('✓ Last committed: just now (encrypted)');
                    } else {
                        setGithubStatus('✗ Error: ' + (data.error || 'Unknown error'));
                    }
                } catch (error) {
                    setGithubStatus('✗ Error: ' + error.message);
                }
            };

            if (!isLoggedIn) {
                return (
                    <div className="login-container">
                        <div className="login-box">
                            <h1>🔐 Admin Panel</h1>
                            <form onSubmit={handleLogin}>
                                <input
                                    type="password"
                                    placeholder="Password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    autoFocus
                                />
                                <button type="submit">Login</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="admin-container">
                    <div className="admin-header">
                        <h1>📋 Clipboard Manager</h1>
                        <button className="logout-btn" onClick={() => setIsLoggedIn(false)}>Logout</button>
                    </div>

                    {message && <div className={`message ${message.type}`}>{message.text}</div>}

                    <div className="section">
                        <h2>➕ Add New Button</h2>
                        <form onSubmit={handleAddButton}>
                            <div className="form-group">
                                <label>Button Label</label>
                                <input
                                    type="text"
                                    placeholder="e.g., API Key"
                                    value={label}
                                    onChange={(e) => setLabel(e.target.value)}
                                />
                            </div>
                            <div className="form-group">
                                <label>Content to Copy</label>
                                <textarea
                                    placeholder="e.g., sk-1234567890..."
                                    value={content}
                                    onChange={(e) => setContent(e.target.value)}
                                />
                            </div>
                            <button type="submit" className="btn-primary">Add Button</button>
                        </form>
                    </div>

                    <div className="section">
                        <h2>🎯 Your Buttons ({buttons.length})</h2>
                        <div className="form-group">
                            <input
                                type="text"
                                placeholder="Search buttons..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                style={{ marginBottom: '16px' }}
                            />
                        </div>
                        {buttons.length === 0 ? (
                            <p style={{ color: '#94a3b8' }}>No buttons yet. Add one above!</p>
                        ) : (
                            <div className="buttons-grid">
                                {buttons
                                    .filter(btn => btn.label.toLowerCase().includes(searchQuery.toLowerCase()))
                                    .map(btn => (
                                    <div key={btn.id} className="button-card">
                                        <div className="label">{btn.label}</div>
                                        <button onClick={() => handleCopy(btn.content, btn.id)}>
                                            {copiedId === btn.id ? '✓ Copied!' : 'Copy'}
                                        </button>
                                        <button className="delete btn-danger" onClick={() => handleDeleteButton(btn.id)}>Delete</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="section">
                        <h2>🍎 Apple Generator</h2>
                        <p style={{ color: '#cbd5e1', fontSize: '12px', marginBottom: '16px' }}>Pattern: {THING1}[NUMBER]{THING2}[PARAMS]{THING3} | Char Limit: 200</p>
                        <div className="form-group">
                            <label>Enter Number</label>
                            <input
                                type="text"
                                placeholder="e.g., 123"
                                value={appleNumber}
                                onChange={(e) => {
                                    const val = e.target.value;
                                    if (val === '' || /^\d+$/.test(val)) {
                                        setAppleNumber(val);
                                    }
                                }}
                            />
                        </div>
                        
                        <div style={{ marginBottom: '16px', padding: '12px', background: '#0f172a', border: '1px solid #334155', borderRadius: '6px' }}>
                            <label style={{ display: 'flex', alignItems: 'center', marginBottom: '8px', cursor: 'pointer' }}>
                                <input 
                                    type="checkbox" 
                                    checked={loopParam} 
                                    onChange={(e) => setLoopParam(e.target.checked)}
                                    style={{ marginRight: '8px' }}
                                />
                                <span style={{ fontSize: '14px' }}>--loop</span>
                            </label>
                            <label style={{ display: 'flex', alignItems: 'center', marginBottom: '8px', cursor: 'pointer' }}>
                                <input 
                                    type="checkbox" 
                                    checked={fullscreenParam} 
                                    onChange={(e) => setFullscreenParam(e.target.checked)}
                                    style={{ marginRight: '8px' }}
                                />
                                <span style={{ fontSize: '14px' }}>--fullscreen</span>
                            </label>
                            <label style={{ display: 'flex', alignItems: 'center', cursor: 'pointer' }}>
                                <input 
                                    type="checkbox" 
                                    checked={videoOnTopParam} 
                                    onChange={(e) => setVideoOnTopParam(e.target.checked)}
                                    style={{ marginRight: '8px' }}
                                />
                                <span style={{ fontSize: '14px' }}>--video-on-top</span>
                            </label>
                        </div>
                        
                        <div style={{ display: 'flex', gap: '8px', marginBottom: '16px' }}>
                            <button className="btn-primary" onClick={generateApple} style={{ flex: 1 }}>Generate Output</button>
                            <button className="btn-primary" onClick={generateAppleMaxed} style={{ flex: 1, background: '#8b5cf6' }}>Generate (Max)</button>
                        </div>
                        
                        {appleOutput && (
                            <div style={{ marginTop: '16px' }}>
                                <div style={{ padding: '12px', background: '#0f172a', border: '1px solid #334155', borderRadius: '6px', wordBreak: 'break-all', fontFamily: 'monospace', fontSize: '12px', color: '#60a5fa', marginBottom: '8px' }}>
                                    {appleOutput} <span style={{ color: '#94a3b8', fontSize: '11px' }}>({appleOutput.length}/200)</span>
                                </div>
                                <button className="btn-primary" onClick={() => {
                                    navigator.clipboard.writeText(appleOutput);
                                    showMessage('✓ Copied!', 'success');
                                }} style={{ width: '100%' }}>Copy Output</button>
                            </div>
                        )}
                    </div>

                    <div className="section">
                        <h2>🚀 GitHub Commit (Encrypted)</h2>
                        <div className="warning">
                            🔒 Buttons are encrypted before committing! buttons.json is unreadable without your encryption password.
                        </div>
                        
                        {!githubAuthed ? (
                            <div style={{ marginBottom: '16px' }}>
                                <p style={{ color: '#cbd5e1', marginBottom: '12px', fontSize: '14px' }}>
                                    Click to authorize with GitHub. Your session lasts 'til you close the tab.
                                </p>
                                <button className="btn-primary" onClick={handleGitHubLogin} style={{ width: '100%', background: '#1f2937', border: '1px solid #374151' }}>
                                    🔗 Authorize with GitHub
                                </button>
                            </div>
                        ) : (
                            <div style={{ marginBottom: '16px', padding: '12px', background: '#10b98140', border: '1px solid #10b981', borderRadius: '6px', color: '#86efac', fontSize: '12px' }}>
                                ✓ Authorized with GitHub (session expires when you close the tab)
                            </div>
                        )}
                        
                        <div className="form-group">
                            <label>Encryption Password</label>
                            <input
                                type="password"
                                placeholder="Password to encrypt buttons"
                                value={encryptPassword}
                                onChange={(e) => setEncryptPassword(e.target.value)}
                            />
                        </div>
                        <button className="btn-primary" onClick={handleCommitToGithub} style={{ width: '100%' }} disabled={!githubAuthed}>Encrypt & Commit to GitHub</button>
                        {githubStatus && <div className="git-status">{githubStatus}</div>}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
